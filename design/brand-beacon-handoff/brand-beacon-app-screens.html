<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<!-- Brand Beacon — app screens, build v1 -->
<title>Brand Beacon — App screens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --yellow:#FFC629; --yellow-hot:#FFD84D; --amber-ink:#9A6B00; --wash:#FFF8E6;
  --ink:#0B0B0B; --body:#34332F; --muted:#5C5A54; --faint:#74716A;
  --line:#E7E5DF; --line-2:#D9D6CF; --white:#fff; --paper:#FAF9F6; --canvas:#F5F4F0;
  --ok:#1F7A4D; --ok-bg:#E9F6EF; --warn:#9A3412; --warn-bg:#FEF0E7;
  --r:11px; --r-lg:16px; --r-xl:22px;
  --ease:cubic-bezier(.22,.61,.36,1);
  --sidebar:252px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Figtree',ui-rounded,'Segoe UI',-apple-system,sans-serif;background:var(--canvas);
  color:var(--body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{color:var(--ink);font-weight:800;letter-spacing:-.024em;line-height:1.15}
h1{font-size:1.72rem;letter-spacing:-.032em}
h2{font-size:1.24rem}
h3{font-size:1rem}
.muted{color:var(--muted)} .faint{color:var(--faint)}

/* ============ mockup switcher (not part of the product) ============ */
.mock{position:fixed;inset:0 0 auto 0;z-index:200;background:#141312;color:#fff;
  display:flex;align-items:center;gap:14px;padding:9px 16px;overflow-x:auto}
.mock__t{font-size:.68rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#9A968C;flex:none}
.mock__b{display:flex;gap:6px}
.mock button{height:30px;padding:0 13px;border-radius:8px;font-size:.8rem;font-weight:600;color:#C9C5BC;white-space:nowrap;transition:.15s}
.mock button:hover{background:#26241F;color:#fff}
.mock button.is-on{background:var(--yellow);color:#1A1400}
body{padding-top:48px}

/* ============ app shell ============ */
.app{display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr);min-height:calc(100vh - 48px)}
.side{background:var(--white);border-right:1px solid var(--line);padding:20px 16px;display:flex;flex-direction:column;gap:22px;position:sticky;top:48px;height:calc(100vh - 48px)}
.side__brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.side__brand svg{width:30px;height:30px;flex:none}
.side__brand span{font-weight:800;font-size:1.06rem;letter-spacing:-.028em;color:var(--ink)}
.side__nav{display:flex;flex-direction:column;gap:3px}
.nav__i{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:var(--r);
  font-size:.88rem;font-weight:600;color:var(--muted);transition:.16s var(--ease)}
.nav__i svg{width:17px;height:17px;flex:none}
.nav__i:hover{background:var(--paper);color:var(--ink)}
.nav__i.is-on{background:var(--wash);color:#5C4200}
.nav__i.is-on svg{color:var(--amber-ink)}
.nav__i.is-lock{color:#A8A59C;cursor:not-allowed}
.nav__i.is-lock:hover{background:none;color:#A8A59C}
.nav__i .lk{margin-left:auto;width:13px;height:13px}
.side__sp{flex:1}
.aff{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;
  border:1px solid var(--line);border-radius:var(--r);background:var(--paper);font-size:.8rem;font-weight:600;color:var(--muted)}
.aff b{display:inline-flex;align-items:center;gap:7px;font-weight:700;color:var(--ink)}
.aff svg{width:14px;height:14px;color:var(--amber-ink)}
.aff span{font-size:.62rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
  background:var(--wash);color:var(--amber-ink);padding:3px 7px;border-radius:5px}
.acct{display:flex;gap:8px}
.acct__l{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:var(--r);background:var(--white);transition:.16s}
.acct__l:hover{border-color:var(--line-2)}
.avat{width:30px;height:30px;border-radius:50%;background:var(--wash);color:var(--amber-ink);
  display:grid;place-items:center;font-size:.76rem;font-weight:800;flex:none}
.acct__n{display:block;font-size:.8rem;font-weight:700;color:var(--ink);line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct__e{display:block;font-size:.72rem;color:var(--faint);line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct__x{width:38px;flex:none;display:grid;place-items:center;border:1px solid var(--line);border-radius:var(--r);color:var(--muted)}
.acct__x:hover{border-color:var(--line-2);color:var(--ink)}
.acct__x svg{width:16px;height:16px}

.main{padding:28px 32px 64px;min-width:0}
.wrapn{max-width:960px;margin:0 auto}
.wrapw{max-width:1240px;margin:0 auto}

/* topline */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:22px;flex-wrap:wrap}
.top>div:first-child{flex:1 1 260px;min-width:0}
.top p{margin-top:5px;font-size:.92rem;color:var(--muted)}
.ent{margin-left:auto;display:inline-flex;flex-wrap:wrap;align-items:center;gap:10px;padding:7px 14px;border:1px solid var(--line);
  border-radius:100px;background:var(--white);font-size:.78rem;color:var(--muted)}
.ent b{color:var(--ink);font-weight:700}
.ent i{width:3px;height:3px;border-radius:50%;background:#C6C3BA}
.ent a{font-weight:700;color:var(--amber-ink)}
.ent a:hover{text-decoration:underline;text-underline-offset:3px}
.ent .low{color:var(--warn);font-weight:600}

/* ============ primitives ============ */
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--r-xl);overflow:hidden}
.card__p{padding:26px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 20px;
  border-radius:var(--r);font-size:.89rem;font-weight:600;letter-spacing:-.01em;white-space:nowrap;transition:.16s var(--ease)}
.btn svg{width:15px;height:15px;flex:none}
.btn--y{background:var(--yellow);color:#1A1400;box-shadow:0 1px 2px rgba(20,15,0,.10),0 8px 20px -8px rgba(255,198,41,.7)}
.btn--y:hover{background:var(--yellow-hot);transform:translateY(-1px)}
.btn--k{background:var(--ink);color:#fff}
.btn--k:hover{background:#242424}
.btn--g{border:1px solid var(--line-2);color:var(--ink);background:var(--white)}
.btn--g:hover{border-color:#BDBAB2;background:var(--paper)}
.btn--sm{height:36px;padding:0 14px;font-size:.83rem}
.btn--w{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed;box-shadow:none}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:100px;
  font-size:.72rem;font-weight:700;letter-spacing:.01em}
.pill--ok{background:var(--ok-bg);color:var(--ok)}
.pill--run{background:var(--wash);color:var(--amber-ink)}
.pill--off{background:var(--paper);color:var(--faint)}
.pill--bad{background:var(--warn-bg);color:var(--warn)}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor}
.fld{height:44px;width:100%;padding:0 14px;border:1px solid var(--line-2);border-radius:var(--r);
  background:var(--white);font-size:.9rem;outline:none;transition:.16s}
.fld:focus{border-color:var(--yellow);box-shadow:0 0 0 3px rgba(255,198,41,.26)}
.lbl{display:block;font-size:.8rem;font-weight:700;color:var(--ink);margin-bottom:7px}
.hint{font-size:.78rem;color:var(--faint);margin-top:7px}

/* ============ stepper ============ */
.step{display:flex;align-items:center;gap:12px;padding:15px 26px;border-bottom:1px solid var(--line);background:var(--paper)}
.step__i{display:flex;align-items:center;gap:9px}
.step__n{width:23px;height:23px;border-radius:50%;display:grid;place-items:center;font-size:.72rem;font-weight:800}
.step__n.todo{background:#E9E7E0;color:#8C897F}
.step__n.now{background:var(--yellow);color:#1A1400}
.step__n.done{background:var(--ink);color:#fff}
.step__n svg{width:11px;height:11px}
.step__l{font-size:.8rem;font-weight:700;color:var(--faint)}
.step__l.now{color:var(--ink)}
.step__l.done{color:var(--muted)}
.step__r{width:26px;height:1px;background:var(--line-2)}

/* ============ search launcher ============ */
.modes{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.mode{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 15px;border-radius:100px;
  border:1px solid var(--line);font-size:.85rem;font-weight:600;color:var(--muted);transition:.18s var(--ease)}
.mode svg{width:15px;height:15px}
.mode:hover:not(.is-on){background:var(--paper);color:var(--ink)}
.mode.is-on{background:var(--ink);border-color:var(--ink);color:#fff}
.sbox{border:2px solid var(--yellow);border-radius:var(--r-xl);padding:20px;background:var(--white);
  box-shadow:0 2px 4px rgba(20,15,0,.04),0 18px 40px -26px rgba(255,198,41,.85)}
.sbox textarea{width:100%;height:52px;resize:none;border:0;outline:0;background:transparent;
  font-size:1.1rem;font-weight:600;letter-spacing:-.015em;color:var(--ink)}
.sbox textarea::placeholder{color:var(--faint)}
.sbox__f{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-top:12px}
.sbox__t{font-size:.79rem;color:var(--faint);line-height:1.5}
.sbox__t b{color:var(--amber-ink)}

/* ============ keyword chips ============ */
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{white-space:nowrap;display:inline-flex;align-items:center;gap:9px;padding:9px 13px;border:1px solid var(--line-2);
  border-radius:var(--r);font-size:.85rem;font-weight:600;color:var(--muted);background:var(--white);transition:.18s var(--ease)}
.chip:hover{border-color:#BDBAB2}
.chip.on{border-color:var(--yellow);background:var(--wash);color:#5C4200}
.chip__b{width:17px;height:17px;border-radius:5px;border:1.5px solid #C4C1B8;display:grid;place-items:center;flex:none}
.chip.on .chip__b{border-color:var(--amber-ink);background:var(--yellow)}
.chip__b svg{width:10px;height:10px;color:#1A1400;opacity:0}
.chip.on .chip__b svg{opacity:1}
.chip__y{font-size:.6rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--amber-ink)}
.chip__x{opacity:.35;display:grid;place-items:center}
.chip__x:hover{opacity:1}
.chip__x svg{width:13px;height:13px}
.freq{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fq{padding:16px;border:1px solid var(--line);border-radius:var(--r-lg);text-align:left;transition:.18s var(--ease)}
.fq:hover{border-color:var(--line-2)}
.fq.on{border-color:var(--yellow);background:var(--wash)}
.fq__t{display:flex;align-items:center;gap:9px;font-size:.92rem;font-weight:700;color:var(--ink)}
.fq__r{width:16px;height:16px;border-radius:50%;border:1.5px solid #C4C1B8;flex:none;display:grid;place-items:center}
.fq.on .fq__r{border-color:var(--amber-ink)}
.fq.on .fq__r::after{content:'';width:8px;height:8px;border-radius:50%;background:var(--amber-ink)}
.fq p{margin-top:7px;font-size:.8rem;color:var(--muted)}
.sect{padding:24px 26px;border-bottom:1px solid var(--line)}
.sect:last-child{border-bottom:none}
.sect__h{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px}
.sect__n{display:inline-flex;align-items:center;gap:10px;font-size:.7rem;font-weight:800;letter-spacing:.14em;
  text-transform:uppercase;color:var(--amber-ink);margin-bottom:8px}
.sect__n::before{content:'';width:18px;height:2px;background:var(--yellow)}

/* ============ running ============ */
.run{text-align:center;padding:44px 26px}
.run__d{width:64px;height:64px;margin:0 auto 22px;border-radius:50%;background:var(--wash);display:grid;place-items:center;position:relative}
.run__d::after{content:'';position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--yellow);
  border-top-color:transparent;animation:spin 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.run__d svg{width:26px;height:26px;color:var(--amber-ink)}
.run__s{max-width:420px;margin:26px auto 0;display:flex;flex-direction:column;gap:11px;text-align:left}
.stg{display:flex;align-items:center;gap:11px;font-size:.87rem;color:var(--faint)}
.stg__d{width:19px;height:19px;border-radius:50%;background:#EDEBE4;display:grid;place-items:center;flex:none}
.stg__d svg{width:10px;height:10px;color:#fff}
.stg.done{color:var(--muted)} .stg.done .stg__d{background:var(--ok)}
.stg.now{color:var(--ink);font-weight:700} .stg.now .stg__d{background:var(--yellow)}
.stg.now .stg__d::after{content:'';width:7px;height:7px;border-radius:50%;background:#1A1400;animation:bp 1.2s ease-in-out infinite}
@keyframes bp{0%,100%{opacity:1}50%{opacity:.25}}
.bar{height:7px;border-radius:100px;background:#EDEBE4;overflow:hidden;max-width:420px;margin:0 auto}
.bar span{display:block;height:100%;background:var(--yellow);border-radius:100px;transition:width .6s var(--ease)}
.capture{max-width:460px;margin:30px auto 0;padding:20px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--paper);text-align:left}

/* ============ toolbar / list ============ */
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:18px}
.srch{position:relative;flex:1;min-width:220px}
.srch svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--faint)}
.srch input{height:40px;width:100%;padding:0 14px 0 38px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--white);font-size:.86rem;outline:none}
.srch input:focus{border-color:var(--yellow);box-shadow:0 0 0 3px rgba(255,198,41,.26)}
.sel{position:relative}
.sel select{height:40px;padding:0 32px 0 12px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--white);
  font-size:.83rem;font-weight:600;color:var(--ink);appearance:none;cursor:pointer;outline:none}
.sel select:focus{border-color:var(--yellow);box-shadow:0 0 0 3px rgba(255,198,41,.26)}
.sel svg{position:absolute;right:11px;top:50%;transform:translateY(-50%);width:13px;height:13px;color:var(--faint);pointer-events:none}
.rows{display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto auto auto;align-items:center;gap:18px;
  padding:16px 20px;background:var(--white);border:1px solid var(--line);border-radius:var(--r-lg);transition:.18s var(--ease)}
.row:hover{border-color:var(--line-2);box-shadow:0 4px 18px -12px rgba(20,15,0,.25)}
.row__i{width:40px;height:40px;border-radius:var(--r);background:var(--wash);color:var(--amber-ink);
  display:grid;place-items:center;font-size:.8rem;font-weight:800;flex:none}
.row__n{display:block;font-size:.95rem;font-weight:700;color:var(--ink);letter-spacing:-.015em}
.row__m{display:block;margin-top:3px;font-size:.78rem;color:var(--faint)}
.row__k{text-align:right}
.row__kv{display:block;font-size:.95rem;font-weight:800;color:var(--ink)}
.row__kl{display:block;font-size:.7rem;color:var(--faint);text-transform:uppercase;letter-spacing:.08em}
.row__x{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--faint)}
.row__x:hover{background:var(--paper);color:var(--ink)}
.row__x svg{width:16px;height:16px}
.empty{padding:64px 26px;text-align:center}
.empty__i{width:56px;height:56px;margin:0 auto 18px;border-radius:var(--r-lg);background:var(--wash);display:grid;place-items:center}
.empty__i svg{width:24px;height:24px;color:var(--amber-ink)}

/* ============ results grid ============ */
.vgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.vc{background:var(--white);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;transition:.18s var(--ease)}
.vc:hover{border-color:var(--line-2);transform:translateY(-2px);box-shadow:0 12px 30px -18px rgba(20,15,0,.4)}
.vt{position:relative;aspect-ratio:9/16;background:var(--paper);overflow:hidden}
.vt img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vt__r{position:absolute;top:9px;left:9px;width:24px;height:24px;border-radius:7px;background:rgba(255,255,255,.94);
  display:grid;place-items:center;font-size:.72rem;font-weight:800;color:#1A1400;z-index:2}
.vt__m{position:absolute;bottom:9px;left:9px;background:var(--yellow);color:#1A1400;font-size:.68rem;font-weight:800;padding:3px 8px;border-radius:6px;z-index:2}
.vt__d{position:absolute;bottom:9px;right:9px;background:rgba(11,11,11,.72);color:#fff;font-size:.66rem;font-weight:700;padding:3px 7px;border-radius:6px;z-index:2}
.vt__p{position:absolute;inset:0;margin:auto;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.94);
  display:grid;place-items:center;box-shadow:0 3px 12px rgba(0,0,0,.28);z-index:2;opacity:0;transition:.2s}
.vc:hover .vt__p{opacity:1}
.vt__p svg{width:13px;height:13px;color:var(--ink);transform:translateX(1px)}
.vb{padding:14px}
.vb__h{font-size:.79rem;font-weight:700;color:var(--amber-ink)}
.vb__c{margin-top:6px;font-size:.82rem;line-height:1.5;color:var(--body);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vb__s{margin-top:12px;padding-top:11px;border-top:1px solid var(--line);display:flex;gap:14px;font-size:.75rem;color:var(--faint)}
.vb__s span{display:inline-flex;align-items:center;gap:5px}
.vb__s svg{width:12px;height:12px}

/* ============ plans ============ */
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;align-items:start}
.plan{background:var(--white);border:1px solid var(--line);border-radius:var(--r-xl);padding:26px;position:relative}
.plan--on{border-color:var(--yellow);box-shadow:0 6px 30px -14px rgba(20,15,0,.2)}
.plan__tag{position:absolute;top:-11px;left:24px;background:var(--yellow);color:#1A1400;font-size:.64rem;
  font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;border-radius:5px}
.plan__n{font-size:.95rem;font-weight:700;color:var(--ink)}
.plan__t{margin-top:4px;font-size:.83rem;color:var(--muted)}
.plan__p{margin-top:18px;font-size:2.2rem;font-weight:900;letter-spacing:-.05em;color:var(--ink);line-height:1}
.plan__p span{font-size:.85rem;font-weight:600;letter-spacing:normal;color:var(--faint)}
.plan__s{margin-top:6px;font-size:.78rem;color:var(--faint);min-height:19px}
.plan ul{list-style:none;margin:20px 0 22px;display:flex;flex-direction:column;gap:8px}
.plan li{display:flex;gap:9px;align-items:flex-start;font-size:.85rem}
.plan li svg{width:14px;height:14px;flex:none;margin-top:4px;color:var(--amber-ink)}

/* ============ settings ============ */
.st{display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px;align-items:start}
.st__nav{display:flex;flex-direction:column;gap:3px;padding:10px;background:var(--white);border:1px solid var(--line);border-radius:var(--r-lg)}
.st__i{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:var(--r);font-size:.87rem;font-weight:600;color:var(--muted)}
.st__i svg{width:16px;height:16px}
.st__i:hover{background:var(--paper);color:var(--ink)}
.st__i.is-on{background:var(--wash);color:#5C4200}
.st__i.is-on svg{color:var(--amber-ink)}
.st__u{display:flex;align-items:center;gap:12px;padding:16px;background:var(--white);border:1px solid var(--line);border-radius:var(--r-lg);margin-bottom:14px}
.st__u .avat{width:44px;height:44px;font-size:1rem}
.rowf{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:18px 0;border-bottom:1px solid var(--line)}
.rowf:last-child{border-bottom:none}
.rowf__t{font-size:.9rem;font-weight:700;color:var(--ink)}
.rowf__d{margin-top:3px;font-size:.81rem;color:var(--muted)}
.sw{width:44px;height:26px;border-radius:100px;background:#DDDAD2;position:relative;flex:none;transition:.2s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.2s var(--ease)}
.sw.on{background:var(--yellow)} .sw.on::after{left:21px}
.meter{height:8px;border-radius:100px;background:#EDEBE4;overflow:hidden}
.meter span{display:block;height:100%;border-radius:100px;background:var(--yellow)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}


/* ============ tabs ============ */
.tabs{display:flex;gap:4px;padding:4px;background:var(--white);border:1px solid var(--line);
  border-radius:var(--r-lg);margin-bottom:18px;width:fit-content;max-width:100%;overflow-x:auto}
.tab{height:38px;padding:0 16px;border-radius:var(--r);font-size:.87rem;font-weight:600;
  color:var(--muted);white-space:nowrap;transition:.16s var(--ease);display:inline-flex;align-items:center;gap:8px}
.tab:hover:not(.is-on){background:var(--paper);color:var(--ink)}
.tab.is-on{background:var(--wash);color:#5C4200}
.tab__c{font-size:.72rem;font-weight:700;padding:1px 7px;border-radius:100px;background:rgba(0,0,0,.05)}
.tab.is-on .tab__c{background:rgba(154,107,0,.15);color:var(--amber-ink)}

/* ============ run confirmation popup ============ */
.runpop{position:fixed;inset:0;z-index:340;display:flex;align-items:center;justify-content:center;padding:24px}
.runpop[hidden]{display:none}
.runpop__bg{position:absolute;inset:0;background:rgba(11,11,11,.42);backdrop-filter:blur(4px)}
.runpop__box{position:relative;z-index:2;width:min(420px,100%);background:var(--white);border-radius:var(--r-xl);
  padding:28px;text-align:center;box-shadow:0 30px 80px -24px rgba(20,15,0,.45);
  animation:popin .24s var(--ease)}
@keyframes popin{from{transform:translateY(10px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.runpop__i{width:52px;height:52px;margin:0 auto 16px;border-radius:50%;background:var(--wash);
  display:grid;place-items:center;color:var(--amber-ink);position:relative}
.runpop__i::after{content:'';position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--yellow);
  border-top-color:transparent;animation:spin 1.1s linear infinite}
.runpop__i svg{width:22px;height:22px}
.runpop__box h3{font-size:1.14rem}
.runpop__box p{margin:9px 0 20px;font-size:.9rem;line-height:1.6;color:var(--muted)}
.runpop__box b{color:var(--ink);font-weight:700}

/* ============ optional sources step ============ */
.srcs{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.src{border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;background:var(--white);transition:.18s}
.src.is-on{border-color:var(--yellow);background:var(--wash)}
.src__h{display:flex;align-items:flex-start;gap:11px}
.src__i{width:34px;height:34px;border-radius:10px;background:var(--white);border:1px solid var(--line);
  display:grid;place-items:center;flex:none;color:var(--amber-ink)}
.src__i svg{width:15px;height:15px}
.src__t{font-size:.92rem;font-weight:700;color:var(--ink)}
.src__ok{margin-left:auto;flex:none;display:inline-flex;align-items:center;gap:5px;font-size:.7rem;font-weight:700;
  color:var(--ok);background:var(--ok-bg);padding:4px 8px;border-radius:6px}
.src__ok svg{width:10px;height:10px}
.src__f{display:flex;align-items:center;gap:2px;margin-top:14px;padding:0 13px;height:44px;
  background:var(--white);border:1px solid var(--line-2);border-radius:var(--r)}
.src__f:focus-within{border-color:var(--yellow);box-shadow:0 0 0 3px rgba(255,198,41,.26)}
.src__pre{font-size:.9rem;font-weight:600;color:var(--faint);flex:none}
.src__f .fld{height:42px;background:transparent}
.src__m{margin-top:9px;font-size:.76rem;color:var(--muted)}
.gains{margin-top:18px;padding:16px 18px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg)}
.gains__t{display:flex;align-items:center;gap:8px;font-size:.72rem;font-weight:800;letter-spacing:.1em;
  text-transform:uppercase;color:var(--amber-ink)}
.gains__t svg{width:13px;height:13px}
.gains__g{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:12px}
.gains__g b{display:block;font-size:.85rem;color:var(--ink)}
.gains__g span{display:block;margin-top:3px;font-size:.78rem;line-height:1.45;color:var(--muted)}
.phead{margin-bottom:20px}
.phead h2{font-size:1.3rem}
.phead p{margin-top:6px;font-size:.9rem;color:var(--muted)}
@media (max-width:820px){ .srcs,.gains__g{grid-template-columns:1fr} }

/* ============ brand searches ============ */
.bhero{background:var(--white);border:1px solid var(--line);border-radius:var(--r-xl);padding:24px;margin-bottom:26px}
.bhero__k{font-size:.7rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--amber-ink);margin-bottom:14px}
.bhero__k::before{content:'';display:inline-block;width:18px;height:2px;background:var(--yellow);vertical-align:middle;margin-right:9px}
.bhero .sbox{box-shadow:0 2px 4px rgba(20,15,0,.04),0 16px 34px -24px rgba(255,198,41,.85)}
.bhero__r{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:16px}
.bhero__rl{font-size:.76rem;font-weight:700;color:var(--faint);margin-right:2px}
.rchip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:100px;
  border:1px solid var(--line);background:var(--white);font-size:.82rem;font-weight:600;color:var(--muted);transition:.16s}
.rchip:hover{border-color:var(--line-2);color:var(--ink);background:var(--paper)}
.rchip svg{width:12px;height:12px;color:var(--faint)}
.bhero__q{margin-left:auto;font-size:.78rem;color:var(--faint)}

.movers__h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.movers__h h2{font-size:1.12rem;display:flex;align-items:center;gap:10px}
.movers__h h2::before{content:'';width:4px;height:17px;border-radius:3px;background:var(--yellow);flex:none}
.movers__h .note{margin-left:auto}
.movers{margin-bottom:28px}
.movers__g{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.mv{display:flex;gap:12px;padding:12px;background:var(--white);border:1px solid var(--line);border-radius:var(--r-lg);transition:.16s}
.mv:hover{border-color:var(--line-2);transform:translateY(-2px)}
.mv__t{position:relative;width:52px;height:70px;border-radius:9px;overflow:hidden;flex:none;background:var(--paper)}
.mv__t img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mv__x{position:absolute;left:4px;bottom:4px;background:var(--yellow);color:#1A1400;font-size:.6rem;font-weight:800;padding:2px 5px;border-radius:5px}
.mv__b{display:block;font-size:.72rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--amber-ink)}
.mv__c{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  margin-top:4px;font-size:.83rem;line-height:1.45;color:var(--ink)}
.mv__m{display:block;margin-top:5px;font-size:.74rem;color:var(--faint)}

.sugg{margin-bottom:6px}
.sugg__g{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.sg{display:flex;align-items:center;gap:11px;padding:13px 14px;background:var(--paper);border:1px dashed var(--line-2);border-radius:var(--r-lg)}
.sg__av{width:34px;height:34px;border-radius:10px;background:var(--wash);color:var(--amber-ink);
  display:grid;place-items:center;font-size:.72rem;font-weight:800;flex:none}
.sg__n{display:block;font-size:.88rem;font-weight:700;color:var(--ink)}
.sg__w{display:block;font-size:.75rem;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sg .btn{margin-left:auto;flex:none}

.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}
.bcard{display:block;background:var(--white);border:1px solid var(--line);border-radius:var(--r-xl);padding:18px;transition:.18s var(--ease)}
.bcard:hover{border-color:var(--line-2);transform:translateY(-2px);box-shadow:0 12px 30px -20px rgba(20,15,0,.4)}
.bcard__top{display:flex;align-items:center;gap:11px}
.bcard__av{width:38px;height:38px;border-radius:11px;background:var(--wash);color:var(--amber-ink);
  display:grid;place-items:center;font-size:.78rem;font-weight:800;flex:none}
.bcard__n{display:block;font-size:.95rem;font-weight:700;color:var(--ink);letter-spacing:-.015em}
.bcard__h{display:block;font-size:.76rem;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bcard__top .pill{margin-left:auto;flex:none}
.bcard__mid{display:grid;grid-template-columns:repeat(3,auto) 1fr;align-items:end;gap:12px;margin-top:16px}
.bcard__v{display:block;font-size:1.16rem;font-weight:800;color:var(--ink);line-height:1;font-variant-numeric:tabular-nums}
.bcard__l{display:block;margin-top:4px;font-size:.66rem;color:var(--faint);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.bcard__sp{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.bspark{width:88px;height:26px}
.bcard__flat{font-size:.7rem;color:var(--faint)}
.bcard__t{font-size:.74rem;font-weight:800}
.bcard__t.up{color:var(--ok)} .bcard__t.dn{color:var(--warn)}
.bcard__foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px;padding-top:13px;
  border-top:1px solid var(--line);font-size:.78rem;color:var(--faint)}
.bcard__go{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--amber-ink)}
.bcard__go svg{width:12px;height:12px}
@media (max-width:1180px){ .bgrid,.movers__g,.sugg__g{grid-template-columns:repeat(2,1fr)} }
@media (max-width:820px){ .bgrid,.movers__g,.sugg__g{grid-template-columns:1fr} .bhero__q{margin-left:0} }

/* ============ analytics — verbatim .tracker sheet from the repo, palette remapped ============ */
.tracker {
    --paper: #F5F4F0;          /* Brand Beacon canvas */
    --paper-2: #FAF9F6;
    --ink: #0B0B0B;
    --ink-soft: #5C5A54;
    --line: #E7E5DF;
    --violet: #9A6B00;         /* accent role -> amber ink (4.7:1 on white) */
    --violet-soft: #FFF3CF;    /* soft accent -> yellow wash */
    --coral: #C2410C;          /* hot role -> burnt orange */
    --coral-soft: #FEF0E7;
    --good: #1F7A4D;
    --card: #ffffff;
    --shadow:
        0 1px 2px rgba(20, 15, 0, 0.04), 0 10px 30px -8px rgba(20, 15, 0, 0.08);
    --shadow-lg:
        0 2px 4px rgba(20, 15, 0, 0.05), 0 24px 56px -20px rgba(20, 15, 0, 0.18);

    font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
    font-feature-settings: 'ss01', 'cv05';
    line-height: 1.45;
    color: var(--ink);

    /* Own stacking context so the paper wash below can cover the app shell's
       grid and blur decorations without also covering the sidebar, which sits
       at z-40 in the parent context. */
    position: relative;
    z-index: 0;
}





/* Keyboard focus reads as considered, not browser-default. */
.tracker button:focus-visible,
.tracker a:focus-visible {
    outline: 2px solid var(--violet);
    outline-offset: 2px;
    border-radius: 8px;
}

/* ---------- top view bar (back link + outliers/their-content switch) ---------- */

.tracker .viewbar {
    display: flex;
    align-items: center;
    gap: 20px;
    padding-bottom: 14px;
    margin-bottom: 22px;
    border-bottom: 1px solid var(--line);
}

.tracker .viewbar .back {
    color: var(--ink-soft);
    font-size: 13px;
    text-decoration: none;
}

.tracker .viewbar .back:hover {
    color: var(--ink);
}

.tracker .viewbar .spring {
    flex: 1;
}

.tracker .viewswitch button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
}

/* ---------- page head ---------- */

.tracker .crumb {
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-bottom: 14px;
}

.tracker .brandrow {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
}

.tracker .logo {
    width: 56px;
    height: 56px;
    border-radius: 15px;
    background: var(--violet-soft);
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    overflow: hidden;
    font-family: 'Figtree', ui-sans-serif, system-ui, sans-serif;
    font-weight: 800;
    font-size: 22px;
    color: var(--violet);
}

.tracker .logo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.tracker .titlewrap h1 {
    font-family: 'Figtree', ui-sans-serif, system-ui, sans-serif;
    font-weight: 800;
    font-size: 40px;
    line-height: 1;
    letter-spacing: -0.03em;
}

.tracker .handles {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-top: 8px;
    font-size: 13px;
    color: var(--ink-soft);
    flex-wrap: wrap;
}

.tracker .handles .h {
    color: var(--ink);
    font-weight: 500;
}

.tracker .handles .sep {
    width: 1px;
    height: 12px;
    background: var(--line);
}

.tracker .badge {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 5px 10px;
    border-radius: 6px;
    background: var(--violet-soft);
    color: var(--violet);
}

.tracker .head-actions {
    margin-left: auto;
    display: flex;
    gap: 8px;
}

.tracker .tbtn {
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    padding: 8px 14px;
    border-radius: 9px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    white-space: nowrap;
    text-decoration: none;
    box-shadow: 0 1px 2px rgba(20, 15, 0, 0.04);
    transition:
        border-color 0.15s,
        opacity 0.15s,
        transform 0.15s,
        box-shadow 0.15s;
}

.tracker .tbtn:hover {
    border-color: color-mix(in srgb, var(--violet) 45%, var(--line));
    transform: translateY(-1px);
    box-shadow: 0 4px 12px -4px rgba(20, 15, 0, 0.14);
}

.tracker .tbtn:active {
    transform: translateY(0) scale(0.985);
}

.tracker .tbtn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
}

.tracker .tbtn.primary {
    background: var(--ink);
    color: var(--card);
    border-color: var(--ink);
}

.tracker .tbtn.primary:hover {
    box-shadow: 0 8px 20px -8px rgba(20, 15, 0, 0.45);
}

.tracker .tbtn.danger {
    color: var(--coral);
    border-color: color-mix(in srgb, var(--coral) 35%, transparent);
}

/* ---------- view switch ---------- */

.tracker .viewswitch {
    display: flex;
    background: var(--paper-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 3px;
    width: fit-content;
}

.tracker .viewswitch button {
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-soft);
    background: none;
    border: none;
    cursor: pointer;
    padding: 6px 14px;
    border-radius: 7px;
}

.tracker .viewswitch button.on {
    background: var(--card);
    color: var(--ink);
    box-shadow: var(--shadow);
}

/* ---------- AI summary bar ---------- */

.tracker .ai {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    background: linear-gradient(
        90deg,
        color-mix(in srgb, var(--violet) 10%, var(--card)),
        var(--card) 60%
    );
    border: 1px solid color-mix(in srgb, var(--violet) 28%, var(--line));
    border-radius: 13px;
    padding: 13px 16px;
    margin-top: 22px;
    box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.6),
        0 6px 18px -10px color-mix(in srgb, var(--violet) 35%, transparent);
}



.tracker .ai .spark {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    margin-top: 2px;
    fill: var(--violet);
}

.tracker .ai .txt {
    font-size: 13.5px;
    line-height: 1.5;
}

.tracker .ai .txt b {
    font-weight: 600;
}

.tracker .ai .when {
    font-size: 11px;
    color: var(--ink-soft);
    white-space: nowrap;
    margin-left: auto;
    padding-left: 12px;
    flex-shrink: 0;
}

/* ---------- signal tiles ---------- */

.tracker .stats {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    margin-top: 14px;
}

.tracker .stat {
    background: var(--card);
    padding: 17px 18px 15px;
    transition: background 0.2s;
}

.tracker .stat:hover {
    background: color-mix(in srgb, var(--violet) 3%, var(--card));
}

.tracker .stat .k {
    font-size: 11px;
    color: var(--ink-soft);
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 9px;
}

.tracker .stat .v {
    font-family: 'Inter', ui-sans-serif, sans-serif;
    font-weight: 700;
    font-size: 25px;
    letter-spacing: -0.02em;
    line-height: 1;
}

.tracker .stat .v small {
    font-size: 14px;
    color: var(--ink-soft);
    font-weight: 400;
}

.tracker .stat .d {
    font-size: 12px;
    margin-top: 7px;
    font-weight: 600;
    min-height: 15px;
}

.tracker .up {
    color: var(--good);
}

.tracker .down {
    color: var(--coral);
}

.tracker .flat {
    color: var(--ink-soft);
}

.tracker .stat.hero .v {
    color: var(--coral);
}

/* ---------- section heads ---------- */

.tracker .sect-head {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin: 44px 0 18px;
    flex-wrap: wrap;
}

.tracker .sect-head h2 {
    font-family: 'Figtree', ui-sans-serif, system-ui, sans-serif;
    font-weight: 800;
    font-size: 24px;
    letter-spacing: -0.02em;
    display: flex;
    align-items: center;
    gap: 11px;
}

/* Violet tick before each section title — quiet hierarchy marker. */
.tracker .sect-head h2::before {
    content: '';
    width: 5px;
    height: 19px;
    border-radius: 3px;
    flex-shrink: 0;
    background: linear-gradient(
        180deg,
        var(--violet),
        color-mix(in srgb, var(--violet) 35%, transparent)
    );
}

.tracker .sect-head .note {
    font-size: 13px;
    color: var(--ink-soft);
}

/* ---------- winner block ---------- */

.tracker .winner {
    display: grid;
    grid-template-columns: 300px 1fr;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: var(--shadow-lg);
}

.tracker .winner .vid {
    position: relative;
    aspect-ratio: 9 / 16;
    background: #241f45;
    overflow: hidden;
}

.tracker .winner .vid img.cov {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.tracker .winner .vid .tracker-embed-frame,
.tracker .thumb .tracker-embed-frame {
    width: 126%;
    height: 124%;
    top: -8%;
    left: -13%;
}

.tracker .winner .grad {
    position: absolute;
    inset: 0;
}

.tracker .flag {
    position: absolute;
    top: 12px;
    left: 12px;
    z-index: 3;
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--coral);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 5px 10px;
    border-radius: 8px;
}

.tracker .play {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.92);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
    box-shadow: 0 8px 24px -8px rgba(0, 0, 0, 0.45);
    backdrop-filter: blur(4px);
    transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
}

.tracker .vid:hover .play,
.tracker .thumb:hover .play {
    transform: translate(-50%, -50%) scale(1.08);
}

.tracker .card .play {
    width: 44px;
    height: 44px;
    background: rgba(255, 255, 255, 0.9);
}

.tracker .views-ov {
    position: absolute;
    bottom: 12px;
    left: 12px;
    z-index: 3;
    font-family: 'Inter', ui-sans-serif, sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
}

.tracker .card .views-ov {
    bottom: 10px;
    left: 10px;
    font-size: 12px;
}

.tracker .winner .detail {
    padding: 24px 26px;
    display: flex;
    flex-direction: column;
}

.tracker .winner .dtop {
    display: flex;
    align-items: flex-start;
    gap: 20px;
    flex-wrap: wrap;
}

.tracker .bigscore .n {
    font-family: 'Inter', ui-sans-serif, sans-serif;
    font-weight: 700;
    font-size: 52px;
    line-height: 0.9;
    color: var(--coral);
    letter-spacing: -0.02em;
}

.tracker .bigscore .l {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: var(--ink-soft);
    margin-top: 4px;
}

.tracker .devbig {
    flex: 1;
    min-width: 220px;
    align-self: center;
}

.tracker .devbig .track {
    position: relative;
    height: 26px;
}

.tracker .devbig .ln {
    position: absolute;
    top: 16px;
    left: 0;
    right: 0;
    height: 2px;
    background: var(--line);
}

.tracker .devbig .pack {
    position: absolute;
    top: 12px;
    height: 10px;
    background: var(--violet-soft);
    border: 1px solid color-mix(in srgb, var(--violet) 35%, transparent);
    border-radius: 5px;
}

.tracker .devbig .med {
    position: absolute;
    top: 9px;
    width: 2px;
    height: 16px;
    background: var(--ink-soft);
}

.tracker .devbig .pt {
    position: absolute;
    top: 10px;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--coral);
    border: 2px solid var(--card);
    box-shadow: 0 1px 5px rgba(255, 83, 97, 0.5);
    transform: translateX(-50%);
}

.tracker .devbig .cap {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--ink-soft);
    margin-top: 4px;
}

.tracker .devbig .cap b {
    font-family: 'Inter', ui-sans-serif, sans-serif;
    color: var(--ink);
}

.tracker .winner h3 {
    font-size: 16px;
    font-weight: 600;
    margin: 20px 0 4px;
    line-height: 1.35;
}

.tracker .winner .creator {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-bottom: 18px;
}

.tracker .winner .creator .av {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    object-fit: cover;
    background: var(--violet-soft);
}

.tracker .winner .creator .cn {
    font-size: 13px;
    font-weight: 600;
}

.tracker .winner .creator .cs {
    font-size: 11px;
    color: var(--ink-soft);
}

.tracker .kv {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px 22px;
    border-top: 1px solid var(--line);
    padding-top: 18px;
}

.tracker .kv .row {
    display: flex;
    flex-direction: column;
    gap: 3px;
}

.tracker .kv .row .k {
    font-size: 11px;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.05em;
}

.tracker .kv .row .val {
    font-size: 14px;
    font-weight: 600;
}

.tracker .kv .row .val.mono {
    font-family: 'Inter', ui-sans-serif, sans-serif;
}

.tracker .kv .row .val.empty {
    color: var(--ink-soft);
    font-weight: 400;
}

.tracker .tag {
    display: inline-block;
    background: var(--violet-soft);
    color: var(--violet);
    font-size: 12px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 6px;
}

.tracker .winner .cta {
    margin-top: 20px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

/* ---------- results feed ---------- */

.tracker .feed {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
}

.tracker .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: var(--shadow);
    transition:
        transform 0.15s,
        box-shadow 0.15s;
}

.tracker .card:hover {
    transform: translateY(-3px);
    border-color: color-mix(in srgb, var(--violet) 30%, var(--line));
    box-shadow: var(--shadow-lg);
}

.tracker .thumb img.cov,
.tracker .winner .vid img.cov {
    transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
}

.tracker .card:hover .thumb img.cov,
.tracker .winner .vid:hover img.cov {
    transform: scale(1.045);
}

.tracker .thumb {
    position: relative;
    aspect-ratio: 9 / 16;
    background: #241f45;
    overflow: hidden;
}

.tracker .thumb img.cov {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.tracker .thumb .grad {
    position: absolute;
    inset: 0;
}

.tracker .rank {
    position: absolute;
    top: 10px;
    left: 10px;
    font-family: 'Inter', ui-sans-serif, sans-serif;
    font-weight: 700;
    font-size: 12px;
    color: #fff;
    background: rgba(20, 17, 40, 0.55);
    padding: 3px 8px;
    border-radius: 7px;
    z-index: 3;
}

.tracker .score-tag {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 3;
    background: rgba(255, 255, 255, 0.94);
    border-radius: 10px;
    padding: 7px 9px 6px;
    text-align: right;
    min-width: 58px;
    box-shadow: 0 4px 14px -6px rgba(0, 0, 0, 0.35);
    backdrop-filter: blur(6px);
}

.tracker .score-tag .num {
    font-family: 'Inter', ui-sans-serif, sans-serif;
    font-weight: 700;
    font-size: 18px;
    line-height: 1;
    color: var(--coral);
    display: block;
}

.tracker .score-tag .lbl {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: #565273;
    margin-top: 2px;
    display: block;
}

.tracker .score-tag.mid .num {
    color: var(--violet);
}

.tracker .card-body {
    padding: 12px 13px 13px;
}

.tracker .dev {
    margin-bottom: 11px;
}

.tracker .dev-track {
    position: relative;
    height: 22px;
}

.tracker .dev-line {
    position: absolute;
    top: 14px;
    left: 0;
    right: 0;
    height: 2px;
    background: var(--line);
    border-radius: 2px;
}

.tracker .dev-pack {
    position: absolute;
    top: 11px;
    height: 8px;
    background: var(--violet-soft);
    border: 1px solid color-mix(in srgb, var(--violet) 35%, transparent);
    border-radius: 4px;
}

.tracker .dev-median {
    position: absolute;
    top: 8px;
    width: 2px;
    height: 14px;
    background: var(--ink-soft);
    border-radius: 2px;
}

.tracker .dev-pt {
    position: absolute;
    top: 9px;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--coral);
    border: 2px solid var(--card);
    box-shadow: 0 1px 4px rgba(255, 83, 97, 0.5);
    transform: translateX(-50%);
}

.tracker .dev-pt.mid {
    background: var(--violet);
}

.tracker .dev-cap {
    display: flex;
    justify-content: space-between;
    font-size: 9.5px;
    color: var(--ink-soft);
    margin-top: 2px;
}

.tracker .dev-cap b {
    font-family: 'Inter', ui-sans-serif, sans-serif;
    color: var(--ink);
}

.tracker .creator {
    display: flex;
    align-items: center;
    gap: 8px;
}

.tracker .card .av {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    flex-shrink: 0;
    object-fit: cover;
    background: var(--violet-soft);
}

.tracker .creator .h2n {
    font-size: 13px;
    font-weight: 600;
    line-height: 1.1;
}

.tracker .creator .sub {
    font-size: 11px;
    color: var(--ink-soft);
}

.tracker .card-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 11px;
    padding-top: 11px;
    border-top: 1px solid var(--line);
}

.tracker .metric {
    font-size: 11.5px;
    color: var(--ink-soft);
}

.tracker .metric b {
    font-family: 'Inter', ui-sans-serif, sans-serif;
    color: var(--ink);
    font-weight: 700;
}

.tracker .open {
    font-size: 12px;
    font-weight: 600;
    color: var(--violet);
    text-decoration: none;
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    font-family: inherit;
}

.tracker .open:hover {
    opacity: 0.75;
}

/* ---------- panels ---------- */

.tracker .datagrid {
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 18px;
}

.tracker .panel {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 22px;
    box-shadow: var(--shadow);
}

.tracker .panel h3 {
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 4px;
}

.tracker .panel .psub {
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 18px;
}

.tracker .panel .empty {
    font-size: 12.5px;
    color: var(--ink-soft);
    text-align: center;
    padding: 26px 0;
}

.tracker .spark {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    height: 130px;
}

.tracker .spark .col {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    height: 100%;
    justify-content: flex-end;
}

.tracker .spark .bar2 {
    width: 100%;
    max-width: 34px;
    background: var(--violet-soft);
    border: 1px solid color-mix(in srgb, var(--violet) 35%, transparent);
    border-radius: 6px 6px 0 0;
    position: relative;
}

.tracker .spark .bar2.now {
    background: var(--violet);
    border-color: var(--violet);
}

.tracker .spark .bar2 em {
    position: absolute;
    top: -19px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Inter', ui-sans-serif, sans-serif;
    font-size: 11px;
    font-weight: 700;
    font-style: normal;
    color: var(--ink);
}

.tracker .spark .wl {
    font-size: 11px;
    color: var(--ink-soft);
}

/* Empty-state ghost bars: keep the panel's silhouette, drain its ink. */
.tracker .spark.ghost {
    opacity: 0.55;
}

.tracker .spark.ghost .bar2 {
    background: var(--paper-2);
    border-color: var(--line);
    border-style: dashed;
}

.tracker .ghostnote {
    font-size: 12.5px;
    line-height: 1.55;
    color: var(--ink-soft);
    margin-top: 14px;
    padding: 10px 13px;
    background: var(--paper-2);
    border-radius: 9px;
}

.tracker .dist {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-top: 4px;
}

.tracker .dline {
    display: flex;
    align-items: center;
    gap: 12px;
}

.tracker .dline .rng {
    font-family: 'Inter', ui-sans-serif, sans-serif;
    font-size: 12px;
    width: 70px;
    color: var(--ink-soft);
}

.tracker .dline .dbar {
    flex: 1;
    height: 10px;
    background: var(--paper-2);
    border-radius: 5px;
    overflow: hidden;
}

.tracker .dline .dbar span {
    display: block;
    height: 100%;
    border-radius: 5px;
}

.tracker .dline .cnt {
    font-family: 'Inter', ui-sans-serif, sans-serif;
    font-size: 12px;
    font-weight: 700;
    width: 24px;
    text-align: right;
}

/* ---------- hashtags + sounds ---------- */

.tracker .hs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
}

.tracker .hspanel {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 20px 22px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    height: 356px;
}

.tracker .hspanel h3 {
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
}

.tracker .hlist {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding-right: 6px;
    scrollbar-width: thin;
    scrollbar-color: color-mix(in srgb, var(--violet) 40%, transparent) transparent;
}

.tracker .hlist::-webkit-scrollbar {
    width: 8px;
}

.tracker .hlist::-webkit-scrollbar-thumb {
    background: color-mix(in srgb, var(--violet) 28%, transparent);
    border-radius: 999px;
}

.tracker .hmore {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
}

.tracker .hmore .tbtn {
    width: 100%;
    justify-content: center;
}

.tracker .hrow {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 8px;
    margin: 0 -8px;
    border-top: 1px solid var(--line);
    border-radius: 8px;
    transition: background 0.15s;
}

.tracker .hrow:hover {
    background: color-mix(in srgb, var(--violet) 4%, transparent);
}

.tracker .hrow:first-of-type {
    border-top: none;
}

.tracker .hrow .idx {
    font-family: 'Inter', ui-sans-serif, sans-serif;
    font-size: 12px;
    font-weight: 700;
    color: var(--ink-soft);
    width: 14px;
    flex-shrink: 0;
}

.tracker .hrow .splay {
    width: 30px;
    height: 30px;
    border-radius: 8px;
    background: var(--violet-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

.tracker .hrow .nm {
    font-size: 14px;
    font-weight: 600;
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.tracker .hrow .nm .u {
    color: var(--ink-soft);
    font-weight: 400;
    font-size: 11px;
    display: block;
    margin-top: 1px;
}

.tracker .hrow .cnt {
    font-family: 'Inter', ui-sans-serif, sans-serif;
    font-size: 13px;
    font-weight: 700;
    text-align: right;
    white-space: nowrap;
}

.tracker .hrow .gro {
    font-size: 12px;
    font-weight: 600;
    color: var(--good);
    width: 50px;
    text-align: right;
    flex-shrink: 0;
}

.tracker .hrow .gro.flat {
    color: var(--ink-soft);
}

.tracker .hrow .gro.down {
    color: var(--coral);
}

/* ---------- performance over time ---------- */

.tracker .ts-tabs {
    display: flex;
    gap: 3px;
    background: var(--paper-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 3px;
    width: fit-content;
    margin-bottom: 20px;
}

.tracker .ts-tabs button {
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--ink-soft);
    background: none;
    border: none;
    padding: 7px 14px;
    border-radius: 7px;
    cursor: pointer;
}

.tracker .ts-tabs button.on {
    background: var(--card);
    color: var(--ink);
    box-shadow: var(--shadow);
}

.tracker .ts-head {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 8px;
    flex-wrap: wrap;
}

.tracker .ts-val {
    font-family: 'Inter', ui-sans-serif, sans-serif;
    font-weight: 700;
    font-size: 30px;
    letter-spacing: -0.02em;
}

.tracker .ts-delta {
    font-size: 13px;
    font-weight: 600;
}

.tracker .ts-svg {
    width: 100%;
    height: 210px;
    display: block;
}

.tracker .ts-x {
    display: flex;
    justify-content: space-between;
    font-size: 10.5px;
    color: var(--ink-soft);
    font-family: 'Inter', ui-sans-serif, sans-serif;
    margin-top: 6px;
}

/* ---------- heat map ---------- */

.tracker .heat {
    overflow-x: auto;
}

.tracker .heatgrid {
    display: grid;
    grid-template-columns: 40px repeat(24, 1fr);
    gap: 3px;
    min-width: 660px;
}

.tracker .heatgrid .hh {
    font-size: 10px;
    color: var(--ink-soft);
    font-family: 'Inter', ui-sans-serif, sans-serif;
    text-align: center;
    height: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.tracker .heatgrid .dl {
    font-size: 11px;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    height: 22px;
    font-weight: 500;
}

.tracker .heatgrid .cell {
    height: 22px;
    border-radius: 4px;
    background: var(--paper-2);
}

.tracker .heatlegend {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 16px;
    font-size: 11px;
    color: var(--ink-soft);
}

.tracker .heatlegend .scale {
    display: flex;
    gap: 3px;
}

.tracker .heatlegend .scale i {
    width: 20px;
    height: 12px;
    border-radius: 3px;
}

.tracker .heat-note {
    font-size: 13px;
    margin-top: 16px;
    padding: 11px 14px;
    background: var(--violet-soft);
    border-radius: 10px;
    color: var(--ink);
}

.tracker .heat-note b {
    font-weight: 600;
}

/* ---------- provenance badges ---------- */

.tracker .prov {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 9.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 3px 7px;
    border-radius: 5px;
    white-space: nowrap;
    vertical-align: middle;
}

.tracker .prov.sample {
    background: color-mix(in srgb, #f59e0b 16%, transparent);
    border: 1px solid color-mix(in srgb, #f59e0b 45%, transparent);
    color: #b45309;
}



.tracker .prov.rebuilt {
    background: var(--violet-soft);
    border: 1px solid color-mix(in srgb, var(--violet) 35%, transparent);
    color: var(--violet);
}

.tracker .provnote {
    font-size: 12px;
    color: var(--ink-soft);
    display: flex;
    align-items: flex-start;
    gap: 8px;
    line-height: 1.5;
}

.tracker .provnote code {
    font-family: 'Inter', ui-sans-serif, sans-serif;
    background: var(--paper-2);
    border-radius: 4px;
    padding: 1px 5px;
    font-size: 11px;
}

.tracker .provbox {
    margin-top: 24px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--paper-2);
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 9px;
}

.tracker .loadmore {
    text-align: center;
    margin-top: 26px;
}

.tracker .gate {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 40px 28px;
    text-align: center;
    box-shadow: var(--shadow);
    margin-top: 18px;
}

.tracker .gate h2 {
    font-family: 'Figtree', ui-sans-serif, system-ui, sans-serif;
    font-weight: 800;
    font-size: 26px;
    letter-spacing: -0.02em;
}

.tracker .gate p {
    font-size: 13.5px;
    color: var(--ink-soft);
    margin: 10px auto 0;
    max-width: 460px;
    line-height: 1.55;
}

.tracker .gate .acts {
    margin-top: 22px;
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
}

.tracker .footnote {
    padding: 40px 0 8px;
    text-align: center;
    font-size: 12px;
    color: var(--ink-soft);
}

/* ---------- responsive ---------- */

@media (max-width: 1080px) {
    .tracker .feed {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 820px) {
    .tracker .stats {
        grid-template-columns: repeat(2, 1fr);
    }

    .tracker .datagrid,
    .tracker .hs {
        grid-template-columns: 1fr;
    }

    .tracker .winner {
        grid-template-columns: 1fr;
    }

    .tracker .winner .vid {
        aspect-ratio: 16 / 10;
    }

    .tracker .titlewrap h1 {
        font-size: 32px;
    }

    .tracker .head-actions {
        margin-left: 0;
        width: 100%;
    }
}

@media (max-width: 560px) {
    .tracker .feed {
        grid-template-columns: 1fr 1fr;
    }

    .tracker .kv {
        grid-template-columns: 1fr;
    }

    .tracker .viewbar {
        flex-wrap: wrap;
        gap: 10px;
    }
}

@media (prefers-reduced-motion: reduce) {
    /* Kill motion, but never the play button's centering transform. */
    .tracker .tbtn,
    .tracker .card,
    .tracker .stat,
    .tracker .hrow,
    .tracker .play,
    .tracker .thumb img.cov,
    .tracker .winner .vid img.cov {
        transition: none !important;
    }

    .tracker .tbtn:hover,
    .tracker .card:hover,
    .tracker .card:hover .thumb img.cov,
    .tracker .winner .vid:hover img.cov {
        transform: none !important;
    }

    .tracker .vid:hover .play,
    .tracker .thumb:hover .play {
        transform: translate(-50%, -50%) !important;
    }
}

/* Brand Beacon additions on top of the verbatim tracker sheet */
.tracker .tbtn-ic { padding: 8px 11px; }
.tracker .tbtn-ic svg { width: 16px; height: 16px; display: block; }

  background: rgba(255,255,255,.92); display: flex; align-items: center; justify-content: center;

  letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }

  letter-spacing: -0.02em; color: var(--ink); font-variant-numeric: tabular-nums; }

/* ---------------- charts ---------------- */
function lineChart(vals,labels){
  const W=760,H=190,PL=34,PR=10,PT=12,PB=24;
  const max=Math.ceil(Math.max(...vals)/4)*4, iw=W-PL-PR, ih=H-PT-PB;
  const x=i=>PL+iw*i/(vals.length-1), y=v=>PT+ih-(v/max)*ih;
  const pts=vals.map((v,i)=>[x(i),y(v)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const ticks=[0,max/2,max];
  return `<div class="chart" id="lc"><div class="tip" id="lcTip"></div><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Outliers per week, past 12 weeks">
    ${ticks.map(t=>`<line class="gridline" x1="${PL}" x2="${W-PR}" y1="${y(t)}" y2="${y(t)}"/>
      <text class="axis" x="${PL-8}" y="${y(t)+3.5}" text-anchor="end">${t}</text>`).join('')}
    <path d="${d}" fill="none" stroke="#B98200" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    ${pts.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5" fill="#B98200" stroke="#fff" stroke-width="2"/>`).join('')}
    ${labels.map((l,i)=>i%2===0?`<text class="axis" x="${x(i)}" y="${H-6}" text-anchor="middle">${l}</text>`:'').join('')}
    ${pts.map((p,i)=>`<rect x="${p[0]-iw/(vals.length-1)/2}" y="${PT}" width="${iw/(vals.length-1)}" height="${ih}" fill="transparent"
       data-i="${i}" data-v="${vals[i]}" data-l="${labels[i]}"/>`).join('')}
  </svg></div>`;
}

function barChart(rows,ramp){
  const W=560,H=190,PL=34,PR=8,PT=12,PB=26;
  const max=Math.max(...rows.map(r=>r[1])), iw=W-PL-PR, ih=H-PT-PB;
  const bw=iw/rows.length-10;
  return `<div class="chart" id="bc"><div class="tip" id="bcTip"></div><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Outlier score distribution">
    ${[0,max/2,max].map(t=>`<line class="gridline" x1="${PL}" x2="${W-PR}" y1="${PT+ih-(t/max)*ih}" y2="${PT+ih-(t/max)*ih}"/>
      <text class="axis" x="${PL-8}" y="${PT+ih-(t/max)*ih+3.5}" text-anchor="end">${Math.round(t)}</text>`).join('')}
    ${rows.map((r,i)=>{const h=(r[1]/max)*ih, xx=PL+iw*i/rows.length+5;
      return `<rect x="${xx}" y="${PT+ih-h}" width="${bw}" height="${h}" rx="4" fill="${ramp[i%ramp.length]}"
        data-v="${r[1]}" data-l="${r[0]}"/>
        <text class="axis" x="${xx+bw/2}" y="${H-8}" text-anchor="middle">${r[0]}</text>`;}).join('')}
  </svg></div>`;
}

function heatmap(){
  const max=Math.max(...HEATMAP.flat());
  const cell=v=>HEAT[Math.min(HEAT.length-1,Math.round((v/max)*(HEAT.length-1)))];

    ).join('')}
  </div>
  <div class="lgd"><span>fewer posts</span>${HEAT.map(h=>`<i style="background:${h}"></i>`).join('')}<span>more</span></div>
  </div>`;
}

/* Heatmap data: 7 days x 24 hours, peak Wed 18:00 */
const HM_DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const HM_HL={0:'12a',6:'6a',12:'12p',18:'6p'};
const HM_CELLS=HM_DAYS.map((d,di)=>Array.from({length:24},(_,h)=>{
  const evening=Math.max(0,6-Math.abs(h-18)), noon=Math.max(0,3-Math.abs(h-12));
  const daybump=(di===2?3:di===1||di===3?2:di>=5?1:0);
  return Math.max(0, Math.round((evening+noon*0.6)*(0.55+daybump*0.28))-1);
}));
const HM_MAX=Math.max(...HM_CELLS.flat());

/* tooltips + tab switching, delegated once */
function bindTips(){
  const wire=(wrapId,tipId,sel,fmt)=>{
    const w=document.getElementById(wrapId); if(!w) return;
    const tip=document.getElementById(tipId);
    w.querySelectorAll(sel).forEach(el=>{
      el.addEventListener('mouseenter',e=>{
        const r=el.getBoundingClientRect(), wr=w.getBoundingClientRect();
        tip.innerHTML=fmt(el);
        tip.style.left=(r.left-wr.left+r.width/2)+'px';
        tip.style.top=(r.top-wr.top)+'px';
        tip.style.opacity=1;
      });
      el.addEventListener('mouseleave',()=>tip.style.opacity=0);
    });
  };
  wire('lc','lcTip','rect[data-i]',el=>`${el.dataset.l} · <b>${el.dataset.v}</b> outliers`);
  wire('bc','bcTip','rect[data-l]',el=>`${el.dataset.l} · <b>${el.dataset.v}</b> videos`);
  wire('hm','hmTip','.hm__c',el=>`${el.dataset.l} · <b>${el.dataset.v}</b> posts`);
}

/* ---------------- router ---------------- */
const ORDER=[
 ['dashboard','Dashboard'],['keywords','Search · Keywords'],['sources','Search · Sources (brand)'],
 ['library','Library'],['brands','Brand searches'],['products','Product searches'],['library-videos','Library · Videos'],['analytics','Search detail · Analytics'],['results','Search detail · Simple'],
 ['settings','Settings · Account'],['settings-appearance','Settings · Appearance'],
 ['settings-subscription','Settings · Subscription'],['plans','Settings · Plans'],['login','Login']];

const root=document.getElementById('root'), sw=document.getElementById('switch');
sw.innerHTML=ORDER.map(([k,l])=>`<button data-s="${k}">${l}</button>`).join('');

function go(key){
  if(!SCREENS[key]) return;
  root.innerHTML=SCREENS[key]();
  bindTips();
  [...sw.children].forEach(b=>b.classList.toggle('is-on',b.dataset.s===key));
  window.scrollTo(0,0);
  location.hash=key;
}
sw.addEventListener('click',e=>{const b=e.target.closest('button'); if(b) go(b.dataset.s);});
document.getElementById('runPop').addEventListener('click',e=>{ if(e.target.closest('[data-pclose]')) document.getElementById('runPop').hidden=true; });
root.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab]');
  if(t){ go(t.dataset.tab==='videos'?'library-videos':'library'); return; }
  const hp=e.target.closest('#heroVid .play');
  if(hp){ document.getElementById('heroVid').classList.toggle('playing'); return; }
  const ab=e.target.closest('.bb-analyze');
  if(ab){
    const st=ab.dataset.state||'idle';
    if(st==='idle'){
      ab.dataset.state='loading'; ab.classList.add('is-loading');
      ab.querySelector('.bb-an-tx').textContent='Analyzing\u2026';
      setTimeout(()=>{
        ab.dataset.state='done'; ab.classList.remove('is-loading'); ab.classList.add('is-done');
        ab.querySelector('.bb-an-tx').textContent='View analysis';
        const t=document.getElementById('bbToast');
        if(t){ t.hidden=false; clearTimeout(t._h); t._h=setTimeout(()=>{t.hidden=true;},4200); }
      },2200);
    } else if(st==='done'){
      const m=document.getElementById('anModal'); if(m) m.hidden=false;
    }
    return;
  }
  if(e.target.closest('[data-close]')){ const m=document.getElementById('anModal'); if(m) m.hidden=true; return; }
  const mt=e.target.closest('[data-pane]');
  if(mt){
    const tabs=mt.closest('.bbm-tabs');
    tabs.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===mt));
    document.querySelectorAll('.bbm-pane').forEach(p=>p.hidden=p.dataset.p!==mt.dataset.pane);
    return;
  }
  if(e.target.closest('[data-pclose]')){ document.getElementById('runPop').hidden=true; return; }
  const a=e.target.closest('[data-go]'); if(!a) return;
  e.preventDefault();
  if(a.dataset.flow){ FLOW.kind=a.dataset.flow; FLOW.subject=FLOWCFG[a.dataset.flow].subject; }
  if(a.dataset.go==='submit'){
    /* No loading screen — land back on the right home and confirm in a popup. */
    go(cfg().back);
    document.getElementById('runPopS').textContent=FLOW.subject;
    document.getElementById('runPop').hidden=false;
    return;
  }
  go(a.dataset.go);
});
go((location.hash||'#dashboard').slice(1));
